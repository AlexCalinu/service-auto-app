{% extends "base.html" %}
{% block content %}
<div class="login-page">
    <div class="login-panel">
        <div class="mb-4">
            <p class="text-uppercase text-muted small mb-1">Service auto</p>
            <h1 class="h3 mb-2">Autentificare</h1>
            <p class="text-muted mb-0">Intra in aplicatie pentru a gestiona clienti, masini si lucrari.</p>
        </div>
        <form method="post">
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input class="form-control form-control-lg" id="username" name="username" value="admin" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">Parola</label>
                <input class="form-control form-control-lg" id="password" name="password" type="password" required>
            </div>
            <button class="btn btn-primary btn-lg w-100" type="submit">Login</button>
        </form>
        <p class="text-muted small mt-3 mb-0">Demo: admin / admin123</p>
    </div>
</div>
{% endblock %}
